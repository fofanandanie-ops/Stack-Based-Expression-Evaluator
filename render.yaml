services:
  - type: web
    name: lot-09-cpm-garage
    runtime: python
    region: ohio
    plan: starter
    buildCommand: python -m compileall -q web_server.py
    startCommand: python web_server.py
    disk:
      name: lot-09-cpm-garage-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/cars.sqlite3
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
